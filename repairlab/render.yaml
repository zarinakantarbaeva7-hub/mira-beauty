services:
  - type: web
    name: repairlab
    rootDir: repairlab
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:application --bind 0.0.0.0:$PORT --workers 1 --threads 4
    healthCheckPath: /api/health
    envVars:
      - key: DB_PATH
        value: /var/data/requests.sqlite3
      - key: PYTHON_VERSION
        value: 3.12.8
    disk:
      name: repairlab-data
      mountPath: /var/data
      sizeGB: 1
