name: Build and verify complete VS Code project
on:
  push:
    branches: [ready-project-package]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: |
          python -m pip install -r requirements.txt pillow playwright
          python -m playwright install --with-deps chromium
      - name: Build complete clean project ZIP
        run: |
          python tools/package_project.py
          python -m zipfile -e download/Mira-Beauty.zip .package-check
      - name: Test backend from extracted ZIP
        working-directory: .package-check/Mira-Beauty
        run: python -m unittest discover -s tests -v
      - name: Test photos and mobile pages from extracted ZIP
        working-directory: .package-check/Mira-Beauty
        run: python tools/check_visual_refresh.py
      - name: Verify WSGI entry point
        working-directory: .package-check/Mira-Beauty
        run: |
          python -c "from wsgi import application; assert application.test_client().get('/').status_code == 200; assert application.config['SESSION_COOKIE_SECURE']; print('WSGI import: OK')"
      - name: Record package verification
        run: |
          python -c "from pathlib import Path; Path('download/PACKAGE_CHECK.md').write_text('# Complete project ZIP verification\n\nThe extracted Mira-Beauty.zip passed 23 Flask tests, Chromium checks on 8 pages at widths 360, 390, 768, 1000 and 1440, JPEG checks for 19 distinct local photos, and a WSGI import check. Archive CRC, required files, portable VS Code workspace and port 5019 were checked. Windows launch scripts were inspected but not executed on real Windows. Publishing on PythonAnywhere remains a separate step.\n', encoding='utf-8')"
      - name: Save ready project archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/Mira-Beauty.zip download/Mira-Beauty.sha256 download/PACKAGE_CHECK.md
          git diff --cached --quiet && exit 0
          git commit -m "Save complete verified Mira Beauty project ZIP [skip ci]"
          git push origin HEAD:ready-project-package
