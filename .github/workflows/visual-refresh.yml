name: Verify photos and typography
on:
  push:
    branches: [visual-refresh]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt pillow playwright
          python -m playwright install --with-deps chromium
      - name: Download licensed photographs
        run: python tools/download_photos.py
      - name: Check backend
        run: python -m unittest discover -s tests -v
      - name: Check photographs, fonts and mobile layout
        run: python tools/check_visual_refresh.py
      - name: Store photographs and checked screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/images/*.jpg docs/screenshots/refresh-*.jpg docs/PHOTO_CHECK.md
          git diff --cached --quiet && exit 0
          git commit -m "Save verified salon photographs and visual checks [skip ci]"
          git push origin HEAD:visual-refresh
